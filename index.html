<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Event Propagation</title>
    <style>
      /* Setup the dark background and center everything */
      body {
        background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
      }

      /* Outer Box (2) */
      .div2 {
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        width: 300px;
        height: 400px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        font-weight: bold;
        gap: 20px;
      }

      /* Inner Box (1) */
      .div1 {
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 15px;
        width: 200px;
        height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        gap: 15px;
      }

      /* The Button */
      button {
        background: transparent;
        color: white;
        border: 1px solid white;
        border-radius: 5px;
        padding: 8px 25px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="div2">2</div>
    <script src="app.js"></script>
  </body>
</html>
